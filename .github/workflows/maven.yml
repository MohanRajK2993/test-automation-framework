name: Run Maven Tests

on:
  push:
    branches: [ main, master, develop ]
  

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Java 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Create config.properties
      run: |
        mkdir -p src/test/resources
        cat > src/test/resources/config.properties << EOF
        baseURL=${{ secrets.BASE_URL }}
        authUsername=${{ secrets.AUTH_USERNAME }}
        authPassword=${{ secrets.AUTH_PASSWORD }}
        contentType=application/json
        accept=application/json
        EOF
    
    - name: Verify config.properties
      run: cat src/test/resources/config.properties
    
    - name: Run Maven tests
      run: mvn --batch-mode clean test
    
    - name: Generate test report
      run: mvn --batch-mode surefire-report:report
      if: always()
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: target/surefire-reports/
    
    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: html-report
        path: target/site/surefire-report.html
    
    - name: Print test summary
      if: always()
      run: |
        echo "=== Test Results ==="
        cat target/surefire-reports/*.txt 2>/dev/null || echo "No test results found"
