name: Run Maven Tests

on:
  push:
    branches: [ main, master, develop ]


jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Java 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Create config.properties
      env:
        BASE_URL: ${{ secrets.BASE_URL }}
        AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
        AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
      run: |
        mkdir -p src/test/resources
        echo "baseURL=${BASE_URL}" > src/test/resources/config.properties
        echo "authUsername=${AUTH_USERNAME}" >> src/test/resources/config.properties
        echo "authPassword=${AUTH_PASSWORD}" >> src/test/resources/config.properties
        echo "contentType=application/json" >> src/test/resources/config.properties
        echo "accept=application/json" >> src/test/resources/config.properties
    
    - name: Verify config.properties
      run: |
        echo "=== Config file ==="
        cat src/test/resources/config.properties
        echo "=== File check ==="
        ls -la src/test/resources/
    
    - name: Run Maven tests
      run: mvn test --batch-mode
      
    - name: Generate test report
      run: mvn --batch-mode surefire-report:report
      if: always()
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: target/surefire-reports/
    
    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: html-report
        path: target/site/surefire-report.html
    
    - name: Print test summary
      if: always()
      run: |
        echo "=== Test Results ==="
        cat target/surefire-reports/*.txt 2>/dev/null || echo "No test results found"
